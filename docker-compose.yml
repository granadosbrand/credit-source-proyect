services:
  postgres:
    image: postgres:15-alpine
    container_name: credit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/triggers:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - credit-network

  redis:
    image: redis:7-alpine
    container_name: credit-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - credit-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: credit-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DATABASE_NAME: ${POSTGRES_DB:-credit_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      WEBHOOK_SERVER_URL: http://mock-webhook:4000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - credit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: credit-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
    depends_on:
      - backend
    networks:
      - credit-network

  mock-webhook:
    build:
      context: ./mock-webhook-server
      dockerfile: Dockerfile
    container_name: credit-mock-webhook
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./mock-webhook-server:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - credit-network

volumes:
  postgres_data:
  redis_data:

networks:
  credit-network:
    driver: bridge
